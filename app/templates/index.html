<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Incident Triage Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <span class="inline-flex h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="text-2xl font-bold tracking-tight text-white">AI Log Triage Engine</h1>
                    <span class="px-2.5 py-0.5 text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">v1.0 Live</span>
                </div>
                <p class="text-sm text-slate-400 mt-1">Autonomous Root Cause Analysis (RCA) and microservice incident management</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="fetchIncidents()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <div class="text-sm text-slate-400 font-medium">Total Incidents</div>
                <div id="stat-total" class="text-3xl font-bold text-white mt-2">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <div class="text-sm text-amber-400 font-medium">Active / Open</div>
                <div id="stat-active" class="text-3xl font-bold text-amber-400 mt-2">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <div class="text-sm text-emerald-400 font-medium">Resolved</div>
                <div id="stat-resolved" class="text-3xl font-bold text-emerald-400 mt-2">0</div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Live Incident Stream</h2>
                <span class="text-xs text-slate-400">Polling every 3s</span>
            </div>
            
            <div id="incident-feed" class="divide-y divide-slate-800/60 min-h-[300px]">
                <div class="p-12 text-center text-slate-500">Listening for error events from microservices...</div>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = window.location.origin;

        async function fetchIncidents() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/incidents`);
                const data = await res.json();
                renderIncidents(data.incidents || []);
            } catch (err) {
                console.error("Failed to fetch incidents:", err);
            }
        }

        async function updateStatus(incidentId, newStatus) {
            try {
                await fetch(`${API_BASE}/api/v1/incidents/${incidentId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                fetchIncidents();
            } catch (err) {
                console.error("Failed to update status:", err);
            }
        }

        function renderIncidents(incidents) {
            const feed = document.getElementById('incident-feed');
            
            // Calculate stats
            document.getElementById('stat-total').innerText = incidents.length;
            document.getElementById('stat-active').innerText = incidents.filter(i => i.status !== 'Resolved').length;
            document.getElementById('stat-resolved').innerText = incidents.filter(i => i.status === 'Resolved').length;

            if (incidents.length === 0) {
                feed.innerHTML = `<div class="p-12 text-center text-slate-500">No active incidents detected. Pipeline healthy.</div>`;
                return;
            }

            feed.innerHTML = incidents.slice().reverse().map(inc => {
                const ai = inc.ai_analysis || {};
                const isPending = !inc.ai_analysis;
                
                const statusColors = {
                    'Open': 'bg-rose-500/10 text-rose-400 border-rose-500/20',
                    'Investigating': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'Resolved': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                };

                return `
                <div class="p-6 space-y-4 hover:bg-slate-800/30 transition">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-md ${statusColors[inc.status] || 'bg-slate-800 text-slate-300'} border">
                                ${inc.status}
                            </span>
                            <span class="text-sm font-semibold text-indigo-400">${inc.service}</span>
                            <span class="text-xs text-slate-500">${new Date(inc.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <select onchange="updateStatus('${inc.id}', this.value)" class="bg-slate-800 text-xs border border-slate-700 text-slate-200 rounded px-2.5 py-1.5 focus:outline-none focus:border-indigo-500">
                                <option value="Open" ${inc.status === 'Open' ? 'selected' : ''}>Status: Open</option>
                                <option value="Investigating" ${inc.status === 'Investigating' ? 'selected' : ''}>Status: Investigating</option>
                                <option value="Resolved" ${inc.status === 'Resolved' ? 'selected' : ''}>Status: Resolved</option>
                            </select>
                        </div>
                    </div>

                    <div class="text-sm text-slate-200 font-medium">
                        ${inc.raw_error}
                    </div>

                    ${inc.stack_trace ? `
                    <div class="bg-slate-950 rounded-lg p-3 border border-slate-800/80 text-xs text-rose-300/90 overflow-x-auto">
                        <pre>${inc.stack_trace}</pre>
                    </div>` : ''}

                    <div class="bg-slate-950/60 border border-indigo-500/20 rounded-lg p-4 space-y-3">
                        <div class="flex items-center gap-2 text-xs font-semibold text-indigo-400 uppercase tracking-wider">
                            <svg class="w-4 h-4 animate-spin ${!isPending ? 'hidden' : ''}" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                            ${isPending ? 'AI Analyzing Stack Trace...' : '🤖 AI Root Cause Diagnosis'}
                        </div>

                        ${!isPending ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div>
                                <span class="text-slate-400 block mb-1">Root Cause:</span>
                                <span class="text-slate-200">${ai.root_cause || 'N/A'}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">Suggested Mitigation:</span>
                                <span class="text-emerald-400 font-medium">${ai.suggested_fix || 'N/A'}</span>
                            </div>
                        </div>
                        ${ai.severity ? `
                        <div class="text-xs pt-1 border-t border-slate-800 text-slate-400">
                            Severity Level: <span class="text-amber-400 font-semibold">${ai.severity}</span> | Component: <span class="text-slate-300 font-mono">${ai.affected_component || 'Unknown'}</span>
                        </div>` : ''}
                        ` : '<div class="text-xs text-slate-500 italic">Evaluating error context with Groq LLM engine...</div>'}
                    </div>
                </div>
                `;
            }).join('');
        }

        // Auto-refresh feed every 3 seconds
        fetchIncidents();
        setInterval(fetchIncidents, 3000);
    </script>
</body>
</html>
