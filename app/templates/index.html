<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Log Triage Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          AI Log Triage Engine
          <span class="text-xs font-mono uppercase bg-slate-800 text-slate-400 px-2 py-0.5 rounded">v1.0 Live</span>
        </h1>
        <p class="text-sm text-slate-400 mt-1">Autonomous Root Cause Analysis (RCA) and microservice incident management</p>
      </div>
      <button onclick="fetchIncidents()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded border border-slate-700 transition">
        Refresh
      </button>
    </header>

    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg shadow-sm">
        <div class="text-xs uppercase font-semibold text-slate-400">Total Incidents</div>
        <div id="stat-total" class="text-3xl font-extrabold text-white mt-1">0</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg shadow-sm">
        <div class="text-xs uppercase font-semibold text-amber-400">Active / Open</div>
        <div id="stat-open" class="text-3xl font-extrabold text-amber-400 mt-1">0</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg shadow-sm">
        <div class="text-xs uppercase font-semibold text-emerald-400">Resolved</div>
        <div id="stat-resolved" class="text-3xl font-extrabold text-emerald-400 mt-1">0</div>
      </div>
    </div>

    <!-- Live Incident Stream -->
    <section class="bg-slate-900 border border-slate-800 rounded-lg p-6 space-y-4 shadow-sm">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-base font-semibold text-slate-200">Live Incident Stream</h2>
        <span class="text-xs text-slate-500 font-mono">Polling every 3s</span>
      </div>

      <div id="incidents-container" class="space-y-4">
        <div class="text-center py-12 text-slate-500 text-sm">Waiting for incoming error events...</div>
      </div>
    </section>
  </div>

  <script>
    async function updateStatus(incidentId, newStatus) {
      try {
        await fetch(`/api/v1/incidents/${incidentId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        fetchIncidents();
      } catch (err) {
        console.error('Failed to update status:', err);
      }
    }

    async function fetchIncidents() {
      try {
        const res = await fetch('/api/v1/incidents');
        const incidents = await res.json();

        // Metrics calculations
        document.getElementById('stat-total').textContent = incidents.length;
        document.getElementById('stat-open').textContent = incidents.filter(i => i.status !== 'Resolved').length;
        document.getElementById('stat-resolved').textContent = incidents.filter(i => i.status === 'Resolved').length;

        const container = document.getElementById('incidents-container');
        if (!incidents.length) {
          container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No active incidents detected. Pipeline healthy.</div>`;
          return;
        }

        container.innerHTML = incidents.map(inc => {
          const ai = inc.ai_analysis;
          const isResolved = inc.status === 'Resolved';

          let rcaHtml = '';
          if (!ai) {
            rcaHtml = `
              <div class="bg-blue-950/40 border border-blue-800/40 rounded p-3 text-xs text-blue-300 flex items-center gap-2">
                <span class="animate-spin inline-block w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full"></span>
                AI Agent is analyzing stack trace via Groq...
              </div>`;
          } else {
            rcaHtml = `
              <div class="bg-slate-950 border border-slate-800 rounded p-4 space-y-2 text-xs">
                <div class="flex items-center justify-between text-slate-400">
                  <span class="font-bold text-slate-300 uppercase">AI Diagnosis & Root Cause</span>
                  <span class="px-2 py-0.5 rounded font-mono font-semibold ${
                    ai.severity === 'CRITICAL' ? 'bg-red-950 text-red-400 border border-red-800' :
                    ai.severity === 'HIGH' ? 'bg-orange-950 text-orange-400 border border-orange-800' :
                    'bg-slate-800 text-slate-300'
                  }">${ai.severity || 'UNKNOWN'}</span>
                </div>
                <div class="text-slate-200 font-medium">${ai.root_cause || 'No root cause specified.'}</div>
                <div class="text-slate-400"><strong class="text-slate-300">Component:</strong> ${ai.affected_component || 'N/A'}</div>
                <div class="bg-emerald-950/30 border border-emerald-800/40 text-emerald-300 p-2.5 rounded">
                  <strong>Suggested Fix:</strong> ${ai.suggested_fix || 'No fix provided.'}
                </div>
              </div>`;
          }

          return `
            <div class="border ${isResolved ? 'border-slate-800 opacity-60' : 'border-slate-700 bg-slate-900/60'} rounded-lg p-5 space-y-3 transition">
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                <div class="flex items-center gap-3">
                  <span class="px-2 py-0.5 text-xs font-mono font-bold rounded ${
                    inc.level === 'CRITICAL' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                  }">${inc.level}</span>
                  <span class="font-semibold text-slate-200 text-sm">${inc.service_name}</span>
                  <span class="text-xs text-slate-500 font-mono">${inc.timestamp}</span>
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-xs text-slate-400">Status:</label>
                  <select onchange="updateStatus('${inc.id}', this.value)" class="bg-slate-950 text-xs border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none">
                    <option value="Open" ${inc.status === 'Open' ? 'selected' : ''}>Open</option>
                    <option value="Investigating" ${inc.status === 'Investigating' ? 'selected' : ''}>Investigating</option>
                    <option value="Resolved" ${inc.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                  </select>
                </div>
              </div>

              <div>
                <p class="text-sm font-medium text-red-300 font-mono">${inc.message}</p>
                ${inc.stack_trace ? `<pre class="mt-2 text-[11px] font-mono bg-slate-950 p-2.5 rounded text-slate-400 overflow-x-auto border border-slate-800/80 max-h-32">${inc.stack_trace}</pre>` : ''}
              </div>

              ${rcaHtml}
            </div>`;
        }).join('');
      } catch (err) {
        console.error('Error fetching incidents:', err);
      }
    }

    // Initial load and periodic poll
    fetchIncidents();
    setInterval(fetchIncidents, 3000);
  </script>
</body>
</html>
